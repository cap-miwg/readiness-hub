<script type="text/babel">
const parseCSV = (text) => {
  if (!text || typeof text !== 'string') return [];
  const lines = text.split('\n').filter(l => l.trim());
  if (lines.length === 0) return [];
  const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
  return lines.slice(1).map(line => {
    const row = {};
    let currentVal = '';
    let inQuotes = false;
    let colIndex = 0;
    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      if (char === '"') inQuotes = !inQuotes;
      else if (char === ',' && !inQuotes) {
        if (colIndex < headers.length) row[headers[colIndex]] = currentVal.trim().replace(/^"|"$/g, '');
        currentVal = '';
        colIndex++;
      } else currentVal += char;
    }
    if (colIndex < headers.length) row[headers[colIndex]] = currentVal.trim().replace(/^"|"$/g, '');
    return row;
  });
};

/**
 * ROW INDEXES
 *
 * The per-member builders used to re-scan an entire table for every member
 * (`tasks.filter(t => t.CAPID === member.CAPID)`), so widening the scope from
 * one squadron to a wing plus subunits multiplied the work by the member count
 * rather than adding to it. These helpers group each table once so the same
 * lookups become O(1).
 *
 * parseCSV already trims every value, so normalizing keys here matches both
 * the strict (`a.CAPID === capid`) and defensive
 * (`String(a.CAPID || '').trim() === ...`) comparisons being replaced.
 *
 * Returned arrays are the index's own buckets - read them, don't mutate them.
 */
const indexKey = (val) => String(val === undefined || val === null ? '' : val).trim();

const groupRowsBy = (rows, field) => {
  const map = new Map();
  (rows || []).forEach(row => {
    const key = indexKey(row[field]);
    const bucket = map.get(key);
    if (bucket) bucket.push(row);
    else map.set(key, [row]);
  });
  return map;
};

// First row wins, matching the Array.prototype.find calls this replaces.
const indexRowsBy = (rows, field) => {
  const map = new Map();
  (rows || []).forEach(row => {
    const key = indexKey(row[field]);
    if (!map.has(key)) map.set(key, row);
  });
  return map;
};

const EMPTY_ROWS = Object.freeze([]);
const lookupRows = (map, key) => (map && map.get(indexKey(key))) || EMPTY_ROWS;
const lookupRow = (map, key) => (map && map.get(indexKey(key))) || null;

/**
 * Indexes are cached against the identity of the raw data object, which is
 * replaced wholesale on each parsePayload, so a new payload builds fresh
 * indexes and the old ones become collectable.
 */
const _dataIndexCache = new WeakMap();
const _configIndexCache = new WeakMap();

const getDataIndexes = (dataFiles) => {
  if (!dataFiles) return {};
  const cached = _dataIndexCache.get(dataFiles);
  if (cached) return cached;

  const idx = {
    dutyByCapid: groupRowsBy(dataFiles.duty, 'CAPID'),
    tracksByCapid: groupRowsBy(dataFiles.tracks, 'CAPID'),
    seniorAwardsByCapid: groupRowsBy(dataFiles.seniorAwards, 'CAPID'),
    memberTasksByCapid: groupRowsBy(dataFiles.memberTasks, 'CAPID'),
    memberPathsByCapid: groupRowsBy(dataFiles.memberPaths, 'CAPID'),
    seniorLevelsByCapid: groupRowsBy(dataFiles.seniorLevels, 'CAPID'),
    esMbrAchievementsByCapid: groupRowsBy(dataFiles.esMbrAchievements, 'CAPID'),
    esMbrTasksByCapid: groupRowsBy(dataFiles.esMbrTasks, 'CAPID'),
    orgByOrgId: indexRowsBy(dataFiles.organization, 'ORGID'),
    // Cadet tables
    cadetRankByCapid: groupRowsBy(dataFiles.cadetRank, 'CAPID'),
    cadetAchvByCapid: groupRowsBy(dataFiles.cadetAchv, 'CAPID'),
    cadetAchvAprsByCapid: groupRowsBy(dataFiles.cadetAchvAprs, 'CAPID'),
    cadetActivitiesByCapid: groupRowsBy(dataFiles.cadetActivities, 'CAPID'),
    cadetAwardsByCapid: groupRowsBy(dataFiles.cadetAwards, 'CAPID'),
    cadetDutyByCapid: groupRowsBy(dataFiles.cadetDuty, 'CAPID')
  };

  _dataIndexCache.set(dataFiles, idx);
  return idx;
};

const getConfigIndexes = (configFiles) => {
  if (!configFiles) return {};
  const cached = _configIndexCache.get(configFiles);
  if (cached) return cached;

  const assignmentsByGroupId = groupRowsBy(configFiles.assignments, 'GroupID');
  const taskIdsByGroupId = new Map();
  assignmentsByGroupId.forEach((rows, groupId) => {
    taskIdsByGroupId.set(groupId, new Set(rows.map(a => a.TaskID)));
  });

  const idx = {
    groupsByPathId: groupRowsBy(configFiles.groups, 'PathID'),
    assignmentsByGroupId,
    taskIdsByGroupId,
    esAchievementsByAchvId: indexRowsBy(configFiles.esAchievements, 'AchvID'),
    esAchvStepTasksByAchvId: groupRowsBy(configFiles.esAchvStepTasks, 'AchvID')
  };

  _configIndexCache.set(configFiles, idx);
  return idx;
};

// Parse the AdditionalOptions column from PL_MemberTaskCredit (lightweight, resilient parser)
const parseAdditionalOptions = (optionsString) => {
  if (!optionsString || typeof optionsString !== 'string') return {};
  const trimmed = optionsString.trim();
  const content = trimmed.startsWith('{') && trimmed.endsWith('}')
    ? trimmed.slice(1, -1)
    : trimmed;

  const result = {};
  content.split(',').forEach(part => {
    const [rawKey, ...rest] = part.split(':');
    if (!rawKey || !rest.length) return;
    const key = rawKey.trim();
    const rawValue = rest.join(':').trim().replace(/^"|"$/g, '');
    if (!key) return;
    if (/^(true|false)$/i.test(rawValue)) {
      result[key] = rawValue.toLowerCase() === 'true';
    } else if (rawValue !== '' && !Number.isNaN(Number(rawValue))) {
      result[key] = Number(rawValue);
    } else {
      result[key] = rawValue;
    }
  });
  return result;
};

const normalizeRank = (rank) => {
  if (!rank) return "";
  const r = rank.toUpperCase().replace(".", "").trim();
  if (r === "SENIOR MEMBER" || r === "SM") return "SM";
  if (r.includes("SECOND") || r === "2D LT") return "2D LT";
  if (r.includes("FIRST") || r === "1ST LT") return "1ST LT";
  if (r.includes("CAPTAIN")) return "CAPT";
  if (r.includes("MAJOR")) return "MAJ";
  if (r.includes("LIEUTENANT COLONEL") || r === "LT COL") return "LT COL";
  if (r.includes("COLONEL")) return "COL";
  if (r === "FLIGHT OFFICER") return "FO";
  if (r === "TECHNICAL FLIGHT OFFICER") return "TFO";
  if (r === "SENIOR FLIGHT OFFICER") return "SFO";
  if (r === "STAFF SERGEANT") return "SSGT";
  if (r === "TECHNICAL SERGEANT") return "TSGT";
  if (r === "MASTER SERGEANT") return "MSGT";
  if (r === "SENIOR MASTER SERGEANT") return "SMSGT";
  if (r === "CHIEF MASTER SERGEANT") return "CMSGT";
  return r;
};
</script>
